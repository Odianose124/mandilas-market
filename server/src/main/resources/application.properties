spring.application.name=mandilas-market-server

# ==========================================
# Railway MySQL Database
# ==========================================

spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / Hibernate
# ==========================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ==========================================
# Server
# ==========================================

server.port=${PORT:8080}

# ==========================================
# Cloudinary
# ==========================================

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# ==========================================
# Paystack
# ==========================================

paystack.secret-key=${PAYSTACK_SECRET_KEY}

# ==========================================
# JWT Authentication
# ==========================================

jwt.secret=${JWT_SECRET}